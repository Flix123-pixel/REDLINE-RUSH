<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Blackout Strike Mobile</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; position: absolute; }

  /* PUBG Style HUD */
  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
    transform: translate(-50%, -50%); pointer-events: none;
  }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.85); }
  #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
  #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

  #compass {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.5); border: 1px solid #ffaa00; border-radius: 4px;
    padding: 4px 18px; color: #ffaa00; font-weight: bold; font-size: 14px; letter-spacing: 2px;
  }

  #hud {
    position: absolute; bottom: 20px; left: 25px; color: #fff;
    font-size: 18px; font-weight: bold; text-shadow: 1px 1px 4px #000; pointer-events: none;
  }
  .bar-container { width: 180px; height: 12px; background: rgba(0,0,0,0.6); border: 1px solid #555; margin-top: 5px; border-radius: 6px; overflow: hidden; }
  #health-bar { width: 100%; height: 100%; background: #2ecc71; transition: width 0.2s; }

  /* Mobile Controls */
  .touch-zone { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; touch-action: none; }
  
  /* Left Joystick */
  #joystick-base {
    bottom: 40px; left: 40px; width: 120px; height: 120px;
    background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4);
  }
  #joystick-knob {
    width: 50px; height: 50px; background: rgba(255,170,0,0.7);
    border-radius: 50%; pointer-events: none; transform: translate(0, 0);
  }

  /* Right Action Buttons */
  #fire-btn {
    bottom: 50px; right: 40px; width: 75px; height: 75px;
    background: rgba(231,76,60,0.6); border: 3px solid #e74c3c; color: #fff; font-size: 16px; font-weight: bold;
  }
  #scope-btn {
    bottom: 140px; right: 45px; width: 60px; height: 60px;
    background: rgba(52,152,219,0.5); border: 2px solid #3498db; color: #fff; font-size: 14px; font-weight: bold;
  }

  /* Touch Look Area (Right Screen) */
  #touch-look-zone {
    position: absolute; top: 0; right: 0; width: 50vw; height: 100vh; z-index: 1;
  }
  .interactive-ui { z-index: 10; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<!-- Visual HUD -->
<div id="compass">N • 015 • NE</div>
<div id="crosshair"></div>
<div id="hud">
  <div>AMMO: <span id="ammo-val" style="color: #ffaa00;">30</span> / ∞</div>
  <div class="bar-container"><div id="health-bar"></div></div>
</div>

<!-- Touch Zones -->
<div id="touch-look-zone"></div>
<div id="joystick-base" class="touch-zone interactive-ui"><div id="joystick-knob"></div></div>
<div id="fire-btn" class="touch-zone interactive-ui">FIRE</div>
<div id="scope-btn" class="touch-zone interactive-ui">SCOPE</div>

<script>
// --- AUDIO SYNTHESIZER (GUNSHOT SFX) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playGunshot() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  let bufferSize = audioCtx.sampleRate * 0.15;
  let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  let data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

  let noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  let filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1000;

  let gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();
}

// --- 3D SCENE SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // Realistic Sky
scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// Lighting (Sunlight + Ambient)
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xfffaed, 1.2);
dirLight.position.set(40, 80, 40);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

// --- TERRAIN & ENVIRONMENT ---
const groundGeo = new THREE.PlaneGeometry(600, 600, 32, 32);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x4b5320, roughness: 0.8 }); // Military Olive Green Ground
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Add Military Bunkers / Crates
const boxMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });
for (let i = 0; i < 35; i++) {
  let box = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 4), boxMat);
  box.position.set((Math.random() - 0.5) * 200, 1.5, (Math.random() - 0.5) * 200);
  box.castShadow = true;
  box.receiveShadow = true;
  scene.add(box);
}

// --- TACTICAL PLAYER MODEL (NOT A CAPSULE) ---
const playerGroup = new THREE.Group();
const tacticalVestMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.6 }); // Black armor
const skinMat = new THREE.MeshStandardMaterial({ color: 0xc68642, roughness: 0.7 });
const camoPants = new THREE.MeshStandardMaterial({ color: 0x3b443b, roughness: 0.8 });

// Head & Tactical Helmet
const head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), skinMat);
head.position.y = 1.95;
const helmet = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.25, 0.5), tacticalVestMat);
helmet.position.y = 2.15;
playerGroup.add(head);
playerGroup.add(helmet);

// Torso / Plate Carrier
const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.45), tacticalVestMat);
torso.position.y = 1.3;
torso.castShadow = true;
playerGroup.add(torso);

// Arms holding rifle
const armRight = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.7, 0.22), skinMat);
armRight.position.set(0.5, 1.3, -0.3);
armRight.rotation.x = -Math.PI / 3;
playerGroup.add(armRight);

// Tactical M416 Gun Mesh
const gunGroup = new THREE.Group();
const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.18, 1.2), tacticalVestMat);
const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.4), tacticalVestMat);
gunBarrel.rotation.x = Math.PI / 2;
gunBarrel.position.set(0, 0.05, -0.7);
gunGroup.add(gunBody);
gunGroup.add(gunBarrel);
gunGroup.position.set(0.4, 1.1, -0.6);
playerGroup.add(gunGroup);

// Legs
const legLeft = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.85, 0.3), camoPants);
legLeft.position.set(-0.25, 0.45, 0);
legLeft.castShadow = true;
playerGroup.add(legLeft);

const legRight = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.85, 0.3), camoPants);
legRight.position.set(0.25, 0.45, 0);
legRight.castShadow = true;
playerGroup.add(legRight);

scene.add(playerGroup);

// --- ENEMY TARGETS ---
const enemies = [];
const enemyMat = new THREE.MeshStandardMaterial({ color: 0xb22222 }); // Red Combatants
for (let i = 0; i < 5; i++) {
  let enemy = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 0.6), enemyMat);
  enemy.position.set((Math.random() - 0.5) * 80, 1, -20 - Math.random() * 50);
  enemy.castShadow = true;
  scene.add(enemy);
  enemies.push(enemy);
}

// --- CONTROLS & CAMERA LOGIC ---
let moveX = 0, moveZ = 0;
let pitch = 0, yaw = 0;
let isAiming = false;
let ammo = 30;

// Dual Touch Controls
const touchLookZone = document.getElementById('touch-look-zone');
let lastTouchX = 0, lastTouchY = 0;

touchLookZone.addEventListener('touchstart', (e) => {
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;
});

touchLookZone.addEventListener('touchmove', (e) => {
  let touch = e.touches[0];
  let deltaX = touch.clientX - lastTouchX;
  let deltaY = touch.clientY - lastTouchY;
  lastTouchX = touch.clientX;
  lastTouchY = touch.clientY;

  yaw -= deltaX * 0.006;
  pitch = Math.max(-0.6, Math.min(0.6, pitch - deltaY * 0.006));
});

// Joystick Movement Logic
const joyBase = document.getElementById('joystick-base');
const joyKnob = document.getElementById('joystick-knob');
let baseRect = joyBase.getBoundingClientRect();

joyBase.addEventListener('touchmove', (e) => {
  let t = e.touches[0];
  let dx = t.clientX - (baseRect.left + 60);
  let dy = t.clientY - (baseRect.top + 60);
  let dist = Math.min(45, Math.hypot(dx, dy));
  let angle = Math.atan2(dy, dx);

  let kx = Math.cos(angle) * dist;
  let ky = Math.sin(angle) * dist;
  joyKnob.style.transform = `translate(${kx}px, ${ky}px)`;

  moveX = kx / 45;
  moveZ = ky / 45;
});

joyBase.addEventListener('touchend', () => {
  joyKnob.style.transform = `translate(0px, 0px)`;
  moveX = 0; moveZ = 0;
});

// Scope Button Toggle
document.getElementById('scope-btn').onclick = () => {
  isAiming = !isAiming;
  camera.fov = isAiming ? 32 : 65; // 2x/4x Zoom effect
  camera.updateProjectionMatrix();
};

// Fire Button Logic
document.getElementById('fire-btn').onclick = () => {
  if (ammo > 0) {
    ammo--;
    document.getElementById('ammo-val').innerText = ammo;
    playGunshot();

    // Muzzle flash / Recoil
    gunGroup.position.z += 0.08;
    setTimeout(() => gunGroup.position.z -= 0.08, 60);

    // Hitscan check
    let raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    let hits = raycaster.intersectObjects(enemies);
    if (hits.length > 0) {
      hits[0].object.position.y = -10; // Eliminate target
    }
  }
};

// --- GAME LOOP ---
function animate() {
  requestAnimationFrame(animate);

  // Rotation & Direction
  playerGroup.rotation.y = yaw;

  // Move player relative to view angle
  let forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  let right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

  playerGroup.position.addScaledVector(forward, -moveZ * 0.22);
  playerGroup.position.addScaledVector(right, moveX * 0.22);

  // Camera Over-The-Shoulder (PUBG TPS View)
  let camOffset = new THREE.Vector3(isAiming ? 0.8 : 1.4, isAiming ? 1.8 : 2.2, isAiming ? 2.0 : 4.0);
  camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  camera.position.copy(playerGroup.position).add(camOffset);
  camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.8 + pitch * 3, playerGroup.position.z);

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
  </html>
