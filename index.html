<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redline Rush - 3D Racing</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      border: 4px solid #e74c3c;
      box-shadow: 0 0 25px rgba(231, 76, 60, 0.4);
      background: #000;
    }
    canvas { display: block; }
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 2px 2px 4px #000;
      pointer-events: none;
    }
    #hud span { color: #f39c12; }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    #overlay h1 {
      font-size: 48px;
      color: #e74c3c;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }
    #overlay p {
      font-size: 18px;
      margin-bottom: 25px;
      color: #eee;
    }
    #overlay button {
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      background: #e74c3c;
      border: none;
      color: #fff;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: background 0.2s;
    }
    #overlay button:hover { background: #c0392b; }
  </style>
</head>
<body>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="hud">
      <div>Score: <span id="scoreVal">0</span></div>
      <div>Speed: <span id="speedVal">0</span> MPH</div>
    </div>
    <div id="overlay">
      <h1 id="overTitle">CRASHED!</h1>
      <p id="overDesc">Final Score: 0</p>
      <button onclick="resetGame()">RACE AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const speedVal = document.getElementById('speedVal');
    const overlay = document.getElementById('overlay');
    const overDesc = document.getElementById('overDesc');

    // Engine constants
    const ROAD_WIDTH = 2000;
    const SEGMENT_LEN = 200;
    const RUMBLE_LENGTH = 3;
    const CAMERA_HEIGHT = 1000;
    const DRAW_DISTANCE = 300;
    const CAMERA_DEPTH = 0.84;

    // Track generation
    let segments = [];
    const TOTAL_SEGMENTS = 1600;

    function buildTrack() {
      segments = [];
      for (let i = 0; i < TOTAL_SEGMENTS; i++) {
        let curve = 0;
        if (i > 100 && i < 300) curve = 2.5;
        if (i > 400 && i < 600) curve = -3;
        if (i > 750 && i < 1000) curve = 3.5;
        if (i > 1100 && i < 1300) curve = -2;

        segments.push({
          index: i,
          p1: { world: { z: i * SEGMENT_LEN }, screen: {} },
          p2: { world: { z: (i + 1) * SEGMENT_LEN }, screen: {} },
          curve: curve,
          color: Math.floor(i / RUMBLE_LENGTH) % 2 ? 
            { road: '#34495e', grass: '#27ae60', rumble: '#ecf0f1', lane: '#ecf0f1' } :
            { road: '#2c3e50', grass: '#2ecc71', rumble: '#e74c3c', lane: '#2c3e50' }
        });
      }
    }

    // Traffic Cars
    let traffic = [];
    function spawnTraffic() {
      traffic = [];
      for (let i = 20; i < TOTAL_SEGMENTS - 50; i += 40) {
        traffic.push({
          z: i * SEGMENT_LEN,
          x: (Math.random() * 1.4) - 0.7,
          speed: 120 + Math.random() * 80,
          color: ['#f1c40f', '#9b59b6', '#3498db', '#1abc9c'][Math.floor(Math.random() * 4)]
        });
      }
    }

    // Player state
    let playerX = 0;
    let position = 0;
    let speed = 0;
    const maxSpeed = 360;
    const accel = 180;
    const decel = -140;
    const offRoadDecel = -250;
    let score = 0;
    let isGameOver = false;

    // Controls
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function project(p, cameraX, cameraY, cameraZ) {
      p.camera = {
        x: (p.world.x || 0) - cameraX,
        y: (p.world.y || 0) - cameraY,
        z: (p.world.z || 0) - cameraZ
      };
      const scale = CAMERA_DEPTH / (p.camera.z || 1);
      p.screen.scale = scale;
      p.screen.x = Math.round((canvas.width / 2) + (scale * p.camera.x * canvas.width / 2));
      p.screen.y = Math.round((canvas.height / 2) - (scale * p.camera.y * canvas.height / 2));
      p.screen.w = Math.round((scale * ROAD_WIDTH * canvas.width / 2));
    }

    function drawPolygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineTo(x3, y3);
      ctx.lineTo(x4, y4);
      ctx.closePath();
      ctx.fill();
    }

    function renderVehicle(x, y, scale, color, isPlayer = false) {
      const w = 120 * scale;
      const h = 60 * scale;

      // Body shadow
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(x - w / 2, y, w, h * 0.2);

      // Chassis
      ctx.fillStyle = color;
      ctx.fillRect(x - w * 0.45, y - h, w * 0.9, h * 0.7);

      // Cabin / Windshield
      ctx.fillStyle = '#111';
      ctx.fillRect(x - w * 0.35, y - h * 1.3, w * 0.7, h * 0.5);

      // Taillights
      ctx.fillStyle = isPlayer && keys['ArrowDown'] ? '#ff0000' : '#8b0000';
      ctx.fillRect(x - w * 0.4, y - h * 0.7, w * 0.18, h * 0.18);
      ctx.fillRect(x + w * 0.22, y - h * 0.7, w * 0.18, h * 0.18);

      // Tires
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(x - w * 0.48, y - h * 0.35, w * 0.15, h * 0.4);
      ctx.fillRect(x + w * 0.33, y - h * 0.35, w * 0.15, h * 0.4);
    }

    function update(dt) {
      if (isGameOver) return;

      // Handle Acceleration & Braking
      if (keys['ArrowUp'] || keys['KeyW']) speed += accel * dt;
      else if (keys['ArrowDown'] || keys['KeyS']) speed += decel * dt;
      else speed += (decel / 2) * dt;

      // Off-road penalty
      if (Math.abs(playerX) > 1 && speed > 80) speed += offRoadDecel * dt;

      speed = Math.max(0, Math.min(speed, maxSpeed));

      // Steering
      const turnSpeed = (speed / maxSpeed) * 1.8;
      if (keys['ArrowLeft'] || keys['KeyA']) playerX -= turnSpeed * dt;
      if (keys['ArrowRight'] || keys['KeyD']) playerX += turnSpeed * dt;

      position += speed * 10 * dt;
      const maxTrackZ = TOTAL_SEGMENTS * SEGMENT_LEN;
      while (position >= maxTrackZ) position -= maxTrackZ;

      // Traffic logic & Collision checks
      traffic.forEach(car => {
        car.z += car.speed * 10 * dt;
        while (car.z >= maxTrackZ) car.z -= maxTrackZ;

        // Bounding collision window
        if (Math.abs(car.z - position) < 140) {
          if (Math.abs(playerX - car.x) < 0.32) {
            isGameOver = true;
            overDesc.innerText = `Final Score: ${Math.floor(score)}`;
            overlay.style.display = 'flex';
          }
        }
      });

      // Score accumulation
      score += (speed * dt * 0.4);
      scoreVal.innerText = Math.floor(score);
      speedVal.innerText = Math.floor(speed);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sky
      ctx.fillStyle = '#1a252f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const baseSegment = segments[Math.floor(position / SEGMENT_LEN) % TOTAL_SEGMENTS];
      let dx = -(baseSegment.curve * ((position % SEGMENT_LEN) / SEGMENT_LEN));
      let x = 0;

      // Render 3D Road
      for (let n = 0; n < DRAW_DISTANCE; n++) {
        const segment = segments[(baseSegment.index + n) % TOTAL_SEGMENTS];
        const looped = segment.index < baseSegment.index;
        const camZ = position - (looped ? TOTAL_SEGMENTS * SEGMENT_LEN : 0);

        project(segment.p1, playerX * ROAD_WIDTH - x, CAMERA_HEIGHT, camZ);
        project(segment.p2, playerX * ROAD_WIDTH - x - dx, CAMERA_HEIGHT, camZ);

        x += dx;
        dx += segment.curve;

        if (segment.p1.camera.z <= CAMERA_DEPTH || segment.p2.screen.y >= segment.p1.screen.y) continue;

        const p1 = segment.p1.screen;
        const p2 = segment.p2.screen;

        // Ground Grass
        ctx.fillStyle = segment.color.grass;
        ctx.fillRect(0, p2.y, canvas.width, p1.y - p2.y);

        // Curbs
        const r1 = p1.w * 0.12;
        const r2 = p2.w * 0.12;
        drawPolygon(p1.x - p1.w - r1, p1.y, p1.x - p1.w, p1.y, p2.x - p2.w, p2.y, p2.x - p2.w - r2, p2.y, segment.color.rumble);
        drawPolygon(p1.x + p1.w + r1, p1.y, p1.x + p1.w, p1.y, p2.x + p2.w, p2.y, p2.x + p2.w + r2, p2.y, segment.color.rumble);

        // Asphalt Track
        drawPolygon(p1.x - p1.w, p1.y, p1.x + p1.w, p1.y, p2.x + p2.w, p2.y, p2.x - p2.w, p2.y, segment.color.road);

        // Center Lane Marks
        if (segment.color.lane !== segment.color.road) {
          const lw1 = p1.w * 0.02;
          const lw2 = p2.w * 0.02;
          drawPolygon(p1.x - lw1, p1.y, p1.x + lw1, p1.y, p2.x + lw2, p2.y, p2.x - lw2, p2.y, segment.color.lane);
        }
      }

      // Draw Traffic Cars back-to-front
      const sortedTraffic = [...traffic].sort((a, b) => {
        const distA = (a.z > position) ? (a.z - position) : (TOTAL_SEGMENTS * SEGMENT_LEN - position + a.z);
        const distB = (b.z > position) ? (b.z - position) : (TOTAL_SEGMENTS * SEGMENT_LEN - position + b.z);
        return distB - distA;
      });

      sortedTraffic.forEach(car => {
        let relZ = car.z - position;
        if (relZ < 0) relZ += TOTAL_SEGMENTS * SEGMENT_LEN;

        if (relZ > 0 && relZ < DRAW_DISTANCE * SEGMENT_LEN) {
          const scale = CAMERA_DEPTH / relZ;
          const carScreenX = (canvas.width / 2) + (scale * (car.x - playerX) * ROAD_WIDTH * canvas.width / 2);
          const carScreenY = (canvas.height / 2) - (scale * -CAMERA_HEIGHT * canvas.height / 2);
          renderVehicle(carScreenX, carScreenY, scale * 12, car.color);
        }
      });

      // Draw Player Car fixed in foreground
      renderVehicle(canvas.width / 2, canvas.height - 25, 1.4, '#e74c3c', true);
    }

    function resetGame() {
      playerX = 0;
      speed = 0;
      score = 0;
      position = 0;
      isGameOver = false;
      overlay.style.display = 'none';
      spawnTraffic();
    }

    // Main Loop
    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      update(dt);
      render();
      requestAnimationFrame(gameLoop);
    }

    buildTrack();
    spawnTraffic();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
